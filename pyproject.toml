[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-support"
version = "0.2.0"
description = "Synthetic learning analytics and explainable decision support"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3", "streamlit>=1.40,<2", "plotly>=5.24,<7", "PyYAML>=6,<7", "reportlab>=4.4,<5", "pypdf>=5,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
learning-support = "learning_support.v2_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
